<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7A553A"/>
  </marker>
    
  </defs>
  <rect x="0" y="0" width="1180" height="560" fill="#E6D6C1"/>

<text x="590.0" y="34" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#7A553A" text-anchor="middle" >CORS: O CASO MAIS SIMPLES (UM GET)</text>
<rect x="30" y="62" width="240" height="66" rx="10" fill="#B08968" stroke="#7A553A" stroke-width="2"/>
<text x="150" y="92" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3B2A22" text-anchor="middle" >PÁGINA</text>
<text x="150" y="114" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7A553A" text-anchor="middle" >JavaScript, origem :5500</text>
<line x1="150" y1="132" x2="150" y2="500" stroke="#7A553A" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="470" y="62" width="240" height="66" rx="10" fill="#B08968" stroke="#7A553A" stroke-width="2"/>
<text x="590" y="92" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3B2A22" text-anchor="middle" >NAVEGADOR</text>
<text x="590" y="114" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7A553A" text-anchor="middle" >aplica a regra do CORS</text>
<line x1="590" y1="132" x2="590" y2="500" stroke="#7A553A" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="910" y="62" width="240" height="66" rx="10" fill="#B08968" stroke="#7A553A" stroke-width="2"/>
<text x="1030" y="92" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3B2A22" text-anchor="middle" >API</text>
<text x="1030" y="114" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7A553A" text-anchor="middle" >FastAPI, origem :8000</text>
<line x1="1030" y1="132" x2="1030" y2="500" stroke="#7A553A" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="158" y1="164" x2="582" y2="164" stroke="#7A553A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="370.0" y="152" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#3B2A22" text-anchor="middle" >fetch(".../grupos")</text>
<line x1="598" y1="230" x2="1022" y2="230" stroke="#7A553A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="810.0" y="218" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#3B2A22" text-anchor="middle" >GET /grupos</text>
<text x="810.0" y="252" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#7A553A" text-anchor="middle" >Origin: http://127.0.0.1:5500</text>
<line x1="1022" y1="320" x2="598" y2="320" stroke="#7A553A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="810.0" y="308" font-family="None" font-size="13.5" font-weight="700" fill="#3B2A22" text-anchor="middle" >200 OK + dados</text>
<text x="810.0" y="342" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#7A553A" text-anchor="middle" >Access-Control-Allow-Origin: http://127.0.0.1:5500</text>
<line x1="582" y1="410" x2="158" y2="410" stroke="#7A553A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="370.0" y="398" font-family="None" font-size="13.5" font-weight="700" fill="#3B2A22" text-anchor="middle" >entrega a resposta ao JavaScript</text>
<text x="370.0" y="432" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#7A553A" text-anchor="middle" >a origem confere: pode ler</text>
<circle cx="36" cy="164" r="12" fill="#7A553A"/>
<text x="36" y="169" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F3E9D7" text-anchor="middle" >1</text>
<circle cx="36" cy="230" r="12" fill="#7A553A"/>
<text x="36" y="235" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F3E9D7" text-anchor="middle" >2</text>
<circle cx="36" cy="320" r="12" fill="#7A553A"/>
<text x="36" y="325" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F3E9D7" text-anchor="middle" >3</text>
<circle cx="36" cy="410" r="12" fill="#7A553A"/>
<text x="36" y="415" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F3E9D7" text-anchor="middle" >4</text>
<rect x="120" y="452" width="940" height="78" rx="10" fill="#B08968" stroke="#7A553A" stroke-width="2"/>
<text x="590.0" y="482" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3B2A22" text-anchor="middle" >se o cabeçalho Access-Control-Allow-Origin faltar, ou trouxer outra origem:</text>
<text x="590.0" y="508" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#3B2A22" text-anchor="middle" >o navegador descarta a resposta e o JavaScript recebe um erro, embora o servidor tenha respondido 200</text>
</svg>