<text x="590.0" y="236" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3B2A22" text-anchor="middle" >A página está em  http://127.0.0.1:5500.  Estas URLs são da MESMA origem ou de outra?</text>
