<text x="590.0" y="34" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#7A553A" text-anchor="middle" >ORIGEM = ESQUEMA + HOST + PORTA</text>
<text x="236.12" y="100" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#3B2A22" text-anchor="middle" >http</text>
