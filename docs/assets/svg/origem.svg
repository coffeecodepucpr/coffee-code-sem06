<text x="830" y="477" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3B2A22" text-anchor="start" >o esquema mudou</text>
<text x="590.0" y="540" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7A553A" text-anchor="middle" >o navegador compara as origens ao pé da letra: 127.0.0.1 e localhost são endereços diferentes, mesmo apontando para o mesmo computador</text>
