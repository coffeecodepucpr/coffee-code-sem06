<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7A553A"/>
  </marker>
    
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#E6D6C1"/>

<text x="600.0" y="34" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#7A553A" text-anchor="middle" >A APLICAÇÃO FULL-STACK: DUAS PONTAS, DUAS ORIGENS</text>
<rect x="40" y="80" width="420" height="250" rx="14" fill="#F3E9D7" stroke="#7A553A" stroke-width="2"/>
<text x="250" y="112" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7A553A" text-anchor="middle" >NAVEGADOR</text>
<rect x="70" y="130" width="360" height="120" rx="10" fill="#B08968" stroke="#7A553A" stroke-width="2"/>
<text x="250" y="166" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#3B2A22" text-anchor="middle" >A PÁGINA</text>
<text x="250" y="192" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A553A" text-anchor="middle" >HTML, CSS e JavaScript</text>
<text x="250" y="220" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#3B2A22" text-anchor="middle" >origem: http://127.0.0.1:5500</text>
<text x="250" y="285" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3B2A22" text-anchor="middle" >mostra a tela, lê os cliques e chama a API</text>
<rect x="740" y="80" width="420" height="250" rx="14" fill="#F3E9D7" stroke="#7A553A" stroke-width="2"/>
<text x="950" y="112" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7A553A" text-anchor="middle" >SERVIDOR</text>
<rect x="770" y="130" width="360" height="120" rx="10" fill="#B08968" stroke="#7A553A" stroke-width="2"/>
<text x="950" y="166" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#3B2A22" text-anchor="middle" >A API</text>
<text x="950" y="192" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A553A" text-anchor="middle" >FastAPI, em Python</text>
<text x="950" y="220" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#3B2A22" text-anchor="middle" >origem: http://127.0.0.1:8000</text>
<text x="950" y="285" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3B2A22" text-anchor="middle" >valida, aplica as regras e guarda os dados</text>
<line x1="470" y1="170" x2="730" y2="170" stroke="#7A553A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="150" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7A553A" text-anchor="middle" >pedido (fetch)</text>
<text x="600" y="194" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#3B2A22" text-anchor="middle" >GET /grupos</text>
<line x1="730" y1="262" x2="470" y2="262" stroke="#7A553A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="242" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7A553A" text-anchor="middle" >resposta (JSON)</text>
<text x="600" y="286" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#3B2A22" text-anchor="middle" >200 + dados</text>
<rect x="40" y="370" width="420" height="70" rx="10" fill="#3B2A22" stroke="#7A553A" stroke-width="2"/>
<text x="60" y="400" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#D6BFA6" text-anchor="start" >terminal 1</text>
<text x="60" y="424" font-family="Consolas, monospace" font-size="12.5" font-weight="600" fill="#F3E9D7" text-anchor="start" >python3 -m http.server 5500 --bind 127.0.0.1</text>
<rect x="740" y="370" width="420" height="70" rx="10" fill="#3B2A22" stroke="#7A553A" stroke-width="2"/>
<text x="760" y="400" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#D6BFA6" text-anchor="start" >terminal 2</text>
<text x="760" y="424" font-family="Consolas, monospace" font-size="12.5" font-weight="600" fill="#F3E9D7" text-anchor="start" >fastapi dev main.py</text>
<text x="600.0" y="482" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#7A553A" text-anchor="middle" >as portas são diferentes (5500 e 8000), então o navegador trata as duas pontas como origens diferentes: é aqui que o CORS entra</text>
</svg>