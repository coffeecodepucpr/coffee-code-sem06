<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Estom</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <main class="login-page">
      <div class="login-container">
        <div class="login-logo">
          <h1>Estom</h1>
          <p>Acompanhe. Compare. Economize.</p>
        </div>

        <form class="login-form">
          <div class="login-header">
            <div class="login-icon">
              <i class="bi bi-person"></i>
            </div>

            <h1>Bem-vindo de volta</h1>

            <p>
              Entre na sua conta para continuar acompanhando os preços dos seus
              produtos.
            </p>
          </div>

          <div class="form-group">
            <label for="login-email">E-mail</label>

            <div class="input-container">
              <i class="bi bi-envelope"></i>

              <input
                type="email"
                id="login-email"
                placeholder="seu@email.com"
              />
            </div>

            <small class="form-error" id="email-error"> </small>
          </div>

          <div class="form-group">
            <label for="login-password">Senha</label>

            <div class="input-container">
              <i class="bi bi-lock"></i>

              <input
                type="password"
                id="login-password"
                placeholder="Digite sua senha"
              />
            </div>

            <small class="form-error" id="password-error"> </small>
          </div>

          <button type="submit" class="button button-primary login-button">
            Entrar
            <i class="bi bi-arrow-right"></i>
          </button>
        </form>
      </div>
    </main>

    <script src="assets/js/login.js" defer></script>
  </body>
</html>
