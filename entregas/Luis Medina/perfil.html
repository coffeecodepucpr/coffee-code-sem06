<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Perfil | Estom</title>

    <link rel="stylesheet" href="assets/css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <header class="header">
      <div class="container header-content">
        <a href="index.html" class="logo">Estom</a>
        <nav class="navigation" aria-label="Navegação principal">
          <a href="index.html" class="nav-link active"> Meus Produtos </a>
          <a href="perfil.html" class="nav-link active"> Perfil </a>
          <a href="login.html" class="nav-login"> Entrar </a>
          <button
            class="theme-button"
            id="theme-button"
            type="button"
            aria-label="Alterar tema"
          >
            ☾
          </button>
        </nav>
      </div>
    </header>

    <main class="profile-page">
      <section class="profile-container">
        <div class="profile-header">
          <div class="profile-avatar">
            <i class="bi bi-person"></i>
          </div>

          <div>
            <h1>Minha conta</h1>
            <p>Gerencie as informações do seu perfil.</p>
          </div>
        </div>

        <div class="profile-card">
          <div class="profile-info">
            <div class="profile-field">
              <span class="profile-label"> Nome </span>

              <p id="profile-name">Carregando...</p>
            </div>

            <div class="profile-field">
              <span class="profile-label"> E-mail </span>

              <p id="profile-email">Carregando...</p>
            </div>
          </div>

          <button
            type="button"
            class="button button-secondary"
            id="edit-name-button"
          >
            <i class="bi bi-pencil"></i>
            Editar nome
          </button>
        </div>
      </section>
    </main>

    <script src="assets/js/perfil.js" defer></script>
  </body>
</html>
